name: Build OMNIA AI Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name omnia_ai_mobile .

      - name: Install Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing GitHub Actions variable: API_BASE_URL"
            exit 1
          fi
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnia-ai-mobile-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
